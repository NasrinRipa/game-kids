<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XONIX – 2026</title>
    <link rel="icon" href="data:;base64,=" type="image/x-icon">

    <!-- Bootstrap 3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap-theme.min.css">

    <style>
        /* ── Layout ─────────────────────────────────────────────── */
        .page-wrap    { margin: 0 auto 10px; }
        #graphics     { position: relative; margin: 0 auto; display: block; }

        /* ── Status bar ─────────────────────────────────────────── */
        #statusbar {
            box-sizing: border-box;
            padding: 4px 9px;
            border: 1px solid #aaa;
            background: #f2f2f2;
            font-family: monospace;
            display: block;
            margin: 0 auto 0;
        }
        #status-table td,
        #status-table th { vertical-align: middle; text-align: center; }

        /* ── Game area wrapper (statusbar + canvas scaled together) */
        #game-area { display: block; transform-origin: top left; }

        /* ── Fullscreen mode ────────────────────────────────────── */
        body.fs-mode {
            margin: 0; padding: 0; overflow: hidden; background: #000;
        }
        body.fs-mode .page-wrap {
            background: #000;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Fullscreen vertical sidebar ─────────────────────────── */
        #fs-sidebar {
            display: none;
            flex-direction: column;
            box-sizing: border-box;
            background: #1a1a1a;
            font-family: monospace;
            overflow: hidden;
            padding: 0;
            flex-shrink: 0;
        }
        .fs-sidebar-title {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1 1 0;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
            border-bottom: 1px solid #555;
            background: #111;
        }
        .fs-sidebar-title span {
            font-size: var(--fs-font-title, clamp(12px, 4vw, 36px));
            color: #f0c040;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .fs-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1 1 0;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
            border-bottom: 1px solid #333;
            padding: 2px 0;
        }
        .fs-stat:last-child { border-bottom: none; }
        .fs-stat-label { font-size: var(--fs-font-label, clamp(9px, 1.5vw, 14px)); color: #888; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.1; }
        .fs-stat-value { font-size: var(--fs-font-value, clamp(10px, 2vw, 20px)); color: #fff; font-weight: bold; line-height: 1.1; }
        .fs-sidebar-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1 1 0;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
            border-top: 1px solid #555;
            background: #111;
            padding: 2px 4px;
            text-align: center;
        }
        .fs-sidebar-banner span {
            font-size: var(--fs-font-banner, clamp(9px, 1.5vw, 14px));
            color: #7df;
            font-weight: bold;
            word-break: break-word;
        }
        #fs-banner-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── Fullscreen top bar (portrait: game taller than screen) ── */
        #fs-sidebar.fs-sidebar-top {
            flex-direction: row;
            align-items: stretch;
        }
        #fs-sidebar.fs-sidebar-top .fs-sidebar-title {
            border-right: 1px solid #555;
            border-bottom: none;
            flex: 0 0 auto;
            padding: 0 8px;
        }
        #fs-sidebar.fs-sidebar-top .fs-sidebar-title span {
            font-size: var(--fs-font-title, clamp(12px, 2vw, 22px));
            letter-spacing: 2px;
        }
        #fs-sidebar.fs-sidebar-top .fs-stat {
            border-right: 1px solid #333;
            border-bottom: none;
            flex: 1 1 0;
        }
        #fs-sidebar.fs-sidebar-top .fs-sidebar-banner {
            border-left: 1px solid #555;
            border-top: none;
            flex: 1 1 0;
        }

        /* ── Sidebar on right or bottom: rendered after the game canvas ── */
        #fs-sidebar.fs-sidebar-right,
        #fs-sidebar.fs-sidebar-bottom { order: 1; }

        /* ── Controls row ───────────────────────────────────────── */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .banner-box {
            flex: 1;
            max-width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .banner-inner {
            border: 1px solid #99ccff;
            border-radius: 6px;
            padding: 0;
            width: 240px;
            height: 70px;
            overflow: hidden;
        }
        #banner-canvas {
            display: block;
            width: 240px;
            height: 70px;
        }

        .button-box {
            flex: 1;
            max-width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #play-btn        { width: 240px; }
        #game-status-text { margin-top: 5px; font-size: 14px; color: #666; display: none; }

        .hint-row { margin-top: 5px; font-size: 12px; color: #666; text-align: center; }
    </style>
</head>
<body>

<div class="page-wrap">
    <h3 class="text-center">XONIX javascript</h3>

    <!-- Controls: banner + play button -->
    <div class="controls-row">
        <div class="banner-box">
            <div class="banner-inner">
                <canvas id="banner-canvas" width="240" height="70"></canvas>
            </div>
        </div>
        <div class="button-box">
            <button id="play-btn" class="btn btn-success btn-lg">
                <span class="glyphicon glyphicon-play"></span> Play
            </button>
            <div id="game-status-text">Game Running…</div>
        </div>
    </div>

    <div class="hint-row">
        <kbd>Enter</kbd> Start/Next &nbsp;
        <kbd>Q</kbd> Quit &nbsp;
        <kbd>ESC</kbd> Pause &nbsp;
         <kbd>F11</kbd> Fullscreen
    </div>

    <!-- Fullscreen vertical sidebar (shown in fullscreen when fullscreen_statusbar:true) -->
    <div id="fs-sidebar">
        <div class="fs-sidebar-title"><span>XONIX</span></div>
        <div class="fs-stat"><div class="fs-stat-label">Level</div><div id="fs-s-level" class="fs-stat-value">-</div></div>
        <div class="fs-stat"><div class="fs-stat-label">Time</div><div id="fs-s-time" class="fs-stat-value">--:--</div></div>
        <div class="fs-stat"><div class="fs-stat-label">Progress</div><div id="fs-s-points" class="fs-stat-value">-</div></div>
        <div class="fs-stat"><div class="fs-stat-label">Score</div><div id="fs-s-score" class="fs-stat-value">-</div></div>
        <div class="fs-stat"><div class="fs-stat-label" style="color:red;">&#10084;</div><div id="fs-s-life" class="fs-stat-value">-</div></div>
        <div class="fs-stat"><div class="fs-stat-label">Speed</div><div id="fs-s-speed" class="fs-stat-value">-</div></div>
        <div class="fs-stat"><div class="fs-stat-label">Enemy</div><div id="fs-s-enemy" class="fs-stat-value">-</div></div>
        <div class="fs-sidebar-banner">
            <canvas id="fs-banner-canvas" width="320" height="80"></canvas>
            <span id="fs-s-banner" style="display:none;">READY</span>
        </div>
    </div>

    <!-- Status bar + game canvas wrapped together for unified scaling -->
    <div id="game-area">
    <!-- Status bar -->
    <div id="statusbar" class="my-panel">
        <table id="status-table" style="width:100%; border-collapse:collapse; table-layout:fixed;">
            <thead>
                <tr>
                    <th style="width:14%">Level</th>
                    <th style="width:14%">Time</th>
                    <th style="width:20%">Progress</th>
                    <th style="width:14%">Score</th>
                    <th style="width:10%; color:red; font-size:18px;">&#10084;</th>
                    <th style="width:14%">Speed</th>
                    <th style="width:14%">Enemy</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span id="status-progress-current">-</span>/<span id="status-progress-total">-</span></td>
                    <td><span id="status-time">--:--</span></td>
                    <td><span id="status-points">-</span></td>
                    <td><span id="status-score">-</span></td>
                    <td><span id="status-life">-</span></td>
                    <td><span id="status-speed">-</span></td>
                    <td><span id="status-enemy">-</span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Game canvas area -->
    <div id="graphics" class="my-center"></div>
    </div><!-- /#game-area -->
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<!-- Game entry point -->
<script type="module" src="./main.js"></script>

</body>
</html>
